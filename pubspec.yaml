name: fafu_kebiao
description: 福建农林大学课程表 - 学校统一身份认证登录同步课表，也支持手动录入；查看今日课程与周课表，设置上课提醒
publish_to: "none"
version: 2.2.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: any
  intl: any
  flutter_local_notifications: any
  timezone: any
  http: any
  webview_flutter: any
  flutter_secure_storage: any
  encrypt: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
